<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConstantQuest — Learn the Constants of Mathematics</title>
<meta name="description" content="Learn and quiz yourself on the famous mathematical constants — pi, e, the golden ratio, and more — up to 100 decimal places.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#960;</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand">
      <span class="brand-symbol">π</span>
      <span class="brand-name">Constant<em>Quest</em></span>
    </a>
    <nav class="header-nav" id="header-nav"></nav>
  </div>
</header>

<main id="app" class="app"></main>

<footer class="site-footer">
  <p>Digits generated to 100 decimal places with high-precision arithmetic (mpmath). Built for learning, one digit at a time.</p>
</footer>

<!-- Templates -->
<template id="tpl-home">
  <section class="hero">
    <h1>Master the constants that run the universe.</h1>
    <p>Pick a constant, learn its digits with chunked memory drills, then put yourself to the test — 25, 50, 75, or all 100 decimal places.</p>
  </section>
  <section class="constant-grid" id="constant-grid"></section>
</template>

<template id="tpl-card">
  <article class="card" tabindex="0">
    <div class="card-top">
      <span class="card-symbol"></span>
      <span class="card-badges"></span>
    </div>
    <h3 class="card-name"></h3>
    <p class="card-preview"></p>
    <div class="card-progress">
      <div class="card-progress-bar"><div class="card-progress-fill"></div></div>
      <span class="card-progress-label"></span>
    </div>
  </article>
</template>

<template id="tpl-detail">
  <div class="detail">
    <button class="back-btn" id="back-btn" type="button">&larr; All constants</button>

    <section class="detail-head">
      <div class="detail-symbol"></div>
      <div>
        <h1 class="detail-name"></h1>
        <p class="detail-formula"></p>
      </div>
    </section>

    <p class="detail-fact"></p>

    <div class="difficulty-row">
      <span class="difficulty-label">Difficulty:</span>
      <div class="difficulty-buttons" id="difficulty-buttons"></div>
      <span class="best-streak" id="best-streak"></span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="learn" type="button">📖 Learn</button>
      <button class="mode-tab" data-mode="quiz" type="button">✏️ Quiz</button>
      <button class="mode-tab" data-mode="speed" type="button">⚡ Speed Run</button>
    </div>

    <section class="mode-panel" id="learn-panel"></section>
    <section class="mode-panel hidden" id="quiz-panel"></section>
    <section class="mode-panel hidden" id="speed-panel"></section>
  </div>
</template>

<template id="tpl-stats">
  <div class="stats-view">
    <button class="back-btn" id="stats-back-btn" type="button">&larr; All constants</button>
    <h1>My Progress</h1>
    <p class="stats-intro">Perfect, no-mistake runs earn a mastery badge for that difficulty. Keep drilling to fill the whole row.</p>
    <h2 class="stats-section-heading">Constant Progress</h2>
    <div class="stats-table" id="stats-table"></div>
  </div>
</template>

<template id="tpl-auth">
  <div class="auth-view">
    <button class="back-btn" id="auth-back-btn" type="button">&larr; All constants</button>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-auth-mode="login" type="button">Log In</button>
        <button class="auth-tab" data-auth-mode="signup" type="button">Sign Up</button>
      </div>
      <p class="auth-config-warning hidden" id="auth-config-warning">
        Supabase isn't configured yet — edit <code>config.js</code> with your project URL and anon key, then run <code>supabase-schema.sql</code> in the Supabase SQL Editor. See README.md.
      </p>
      <form id="auth-form" class="auth-form">
        <label class="auth-field username-field hidden">
          <span>Username</span>
          <input type="text" id="auth-username" autocomplete="username" placeholder="e.g. digit_dynamo" maxlength="20">
        </label>
        <label class="auth-field">
          <span>Email</span>
          <input type="email" id="auth-email" autocomplete="email" required>
        </label>
        <label class="auth-field">
          <span>Password</span>
          <input type="password" id="auth-password" autocomplete="current-password" required minlength="6">
        </label>
        <p class="auth-error hidden" id="auth-error"></p>
        <button type="submit" class="primary-btn auth-submit" id="auth-submit">Log In</button>
      </form>
    </div>
  </div>
</template>

<template id="tpl-friends">
  <div class="friends-view">
    <button class="back-btn" id="friends-back-btn" type="button">&larr; All constants</button>
    <h1>Friends</h1>

    <div class="friend-search-row">
      <input type="text" id="friend-search-input" placeholder="Search by username…" autocomplete="off">
      <button id="friend-search-btn" class="secondary-btn" type="button">Search</button>
    </div>
    <div id="friend-search-results" class="friend-results"></div>

    <div id="friend-requests-section">
      <h2>Pending Requests</h2>
      <div id="friend-requests-list" class="friend-list"></div>
    </div>

    <div>
      <h2>Your Friends</h2>
      <div id="friend-list" class="friend-list"></div>
    </div>
  </div>
</template>

<template id="tpl-leaderboard">
  <div class="leaderboard-view">
    <button class="back-btn" id="leaderboard-back-btn" type="button">&larr; All constants</button>
    <h1>Leaderboard</h1>

    <div class="leaderboard-controls">
      <select id="lb-constant-select"></select>
      <select id="lb-difficulty-select"></select>
      <div class="leaderboard-scope-tabs">
        <button class="mode-tab active" data-scope="global" type="button">🌍 Global</button>
        <button class="mode-tab" data-scope="friends" type="button">🤝 Friends</button>
      </div>
    </div>

    <div id="leaderboard-table" class="leaderboard-table"></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="constants-data.js"></script>
<script src="achievements.js"></script>
<script src="app.js"></script>
</body>
</html>
